<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Faction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {


            margin: 0;
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;


        }

        h1 {
            color: #61dafb;
            letter-spacing: 3px;
            margin: 14px 0 8px;
            font-size: clamp(24px, 5vw, 38px)
        }

        #hud {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto 10px;
            padding: 0 12px;
            font-size: 16px;
            font-weight: bold;
        }

        #gameCanvas {
            display: block;
            width: min (900px, 96vw);
            height: auto;
            background: #0d1220;
            border: 2px solid #273653;
            aspect-ratio: 3 / 2;
            border-radius: 10px;
            box-shadow: 0 0 25px #172744;
            touch-action: none;

        }

        #message {
            margin-top: 12px;
            color: #aab6d3;
            font: size 14px;


        }

        button {
            margin-top: 12px;
            padding: 10px 22px;
            border: none;
            border-radius: 7px;
            background: #2463eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #174bc0;
        }

        #restart {
            display: none;

        }
    </style>
</head>

<body>

    <h1>Shadow Faction</h1>

    <span id="score"> Score: 0</span>

    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="message">
        WASD/ Arrow Keys=Move | Mouse Click = Attack
    </div>
    <button id="restart">Restart Game</button>

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const waveText = document.getElementById("wave");

        const L = canvas.height;

        let mouseDown = false;
        let spawnTimer = 0;
        let attackCooldown = 0;
        let lastAttackTime = 0;
        const player = {
            x: W / 2,
            y: H / 2,
            radius: 18,
            speed: 260,
            health: 100,
            maxHealth: 100,
            angle: 0
        };
        let enemies = [];

        let bullets = [];
        // keyboard controls
        window.addEventListener("keydown", function (e) {
            keys[e.key.toLowerCase()] = true;

            if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        window.addEventListener("keyup", function (e) {
            keys[e.key.toLowerCase()] = false;
        });
        // Mouse controls
        canvas.addEventListener("mousemove", function (e) {
            const rect = canvas.getBoundingClientRect();

            mouse.x = (e.clientX - rect.left) * W / rect.width;
            mouse.y = (e.clientY - rect.top) * H / rect.height;
        });
        canvas.addEventListener("mousedown", function (e) {
            if (e.button === 0) {
                mouseDown = true;
            }
        });

        window.addEventListener("mouseup", function (e) {
            if (e.button === 0) {
                mouseDown = false;
            }
        });
        canvas.addEventListener("touchstart", function (e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();

            mouse.x = (touch.clientX - rect.left) * W / rect.width;
            mouse.y = (touch.clientY - rect.top) * H / rect.height;

            mouseDown = true;
        }, { passive: false });

        canvas.addEventListener("touchmove", function (e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();

            mouse.x = (touch.clientX - rect.left) * W / rect.width;
            mouse.y = (touch.clientY - rect.top) * H / rect.height;
        }, { passive: false });

        window.addEventListener("touchend", function () {
            mouseDown = false;
        });
        // Utility functions

            enemies.push({
                x: x,

            });

            const length = Math.hypot(dx, dy);

            if (length === 0) {

            }
            bullets.push({
                x: player.x,

                vx: dx / length * 520,
                vy: dy / length * 520,
                radius: 5,
                life: 1.5
            });

            attackCooldown = 0.18;
        }
        //Update player
        function updatePlayer(dt) {

            let dy = 0;
            if (keys["w"] || keys["arrowup"]) {

            }

            }
